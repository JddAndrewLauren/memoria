# Memoria evidence corpus - raw acquisition pins.
#
# NOT the SRC- ID ledger. That is `raw/manifest.yaml` inside the evidence root
# (ADR-0006, manifest.DEFAULT_MANIFEST_RELATIVE_PATH) and is generated by
# `memoria normalize`. This file records only where the raw archives came from
# and what they hashed to, so a fetch is reproducible and tamper-evident.
#
# Files are downloaded byte-for-byte as published and never rewritten.

source:
  name: EDRM Enron Email Data Set v2 XML
  item: edrm.enron.email.data.set.v2.xml
  mirror: https://archive.org/details/edrm.enron.email.data.set.v2.xml
  lineage: >-
    Released by EDRM. The underlying messages were originally made public by the
    US Federal Energy Regulatory Commission during its Enron investigation.
  licence: Creative Commons Attribution 3.0 United States
  licence_url: https://creativecommons.org/licenses/by/3.0/us/
  attribution: >-
    The licence requires citing the producer: "ZL Technologies, Inc.
    (http://www.zlti.com)". ZL produced the EML, PST and NSF forms for EDRM;
    the copy fetched here is the Internet Archive mirror made by Searchdaimon.
    Every message body carries this attribution as an appended footer - see the
    zl_footer note in docs/corpora/enron.md.
  caveat: >-
    EDRM withdrew v2 over unscreened personally identifiable information; the
    Internet Archive mirror persists. The upstream README warns the content is
    unedited, may be offensive, and may carry viruses. Nothing from this corpus
    is committed to the Memoria repository. The fixtures under
    tests/fixtures/enron/ are invented, not scrubbed copies - see
    docs/corpora/enron.md.

# Where a fetched archive is unpacked, relative to the evidence root.
base: raw/enron

# sha1 and bytes are as published by the Internet Archive metadata API and are
# verifiable without downloading. sha256 is computed on first successful fetch
# and written back here, after which it is enforced.
pinned: 2026-09-01

# The slice, chosen from the recon rather than guessed. `role: candidate`
# archives were fetched as a pool and measured; these four are the connected
# core - 262 of the pool's 351 messages that cross custodians are between these
# four, which is what makes a set more than a pile of unrelated mailboxes. The rest
# stay pinned so the measurement is reproducible and the set can be widened
# without a second search.
slice:
  - scholtes-d
  - semperger-c
  - crandall-s
  - salisbury-h

