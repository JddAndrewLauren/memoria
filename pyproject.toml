[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "Memoria PoC CLI"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
memoria = "memoria.cli:main"
# For a human starting the server by hand. `.mcp.json` uses `python -m
# memoria.mcp` instead, which needs no reinstall to exist.
memoria-mcp = "memoria.mcp.server:main"

[project.optional-dependencies]
# The MCP server (issue #11) is an adapter over the core, not part of it. The
# SDK pulls in a web-server stack - pydantic, starlette, uvicorn, httpx2,
# pyjwt, opentelemetry - and the core's only runtime dependency is PyYAML, so
# it rides in an extra rather than in `dependencies`. `dev` depends on the
# extra, which means the documented install (`pip install -e ".[dev]"`, used by
# the README and by orca.yaml) always yields an importable server and no test
# needs `importorskip` - a skipped test in this repo is a failed one.
# The FastAPI adapter (#64) takes the same shape when it lands.
#
# Major pinned: mcp 2.0 was a breaking rename (FastMCP -> MCPServer,
# mcp.server.fastmcp -> mcp.server.mcpserver).
mcp = [
    "mcp>=2.1,<3",
]
# The FastAPI adapter (#64), the third over the core. Same reasoning as
# `mcp` above: the core stays PyYAML-only, and `dev` pulling this extra in
# is what keeps a route importable in every test rather than skipped.
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]
# The docx/pdf normalizer (#77, part 05 §5.4): MarkItDown for docx, pdfplumber
# for pdf, read directly by memoria.normalize's converter seam. Same
# reasoning as mcp/web above - the core stays PyYAML-only, and `dev` pulling
# this extra in is what keeps `memoria normalize` exercising a real converter
# in every test rather than a skip. `docx` is MarkItDown's own extra for its
# mammoth-based docx path. Exact versions are #79's to pin.
convert = [
    "markitdown[docx]>=0.1,<0.2",
    "pdfplumber>=0.11,<0.12",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "memoria[mcp]",
    "memoria[web]",
    "memoria[convert]",
    # Test-only: builds the .docx fixtures the converter tests convert.
    # Never imported by memoria itself.
    "python-docx>=1.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
