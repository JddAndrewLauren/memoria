[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
description = "Memoria PoC CLI"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    # The semantic index (#81, ADR-0007): a `sqlite-vec` virtual table beside
    # the FTS5 one in `.memoria/index.db`, populated at `memoria rebuild` by
    # a local CPU ONNX model through `fastembed`. Unlike `mcp`/`web`/
    # `convert`/`graph` below, these are not an adapter's dependency to defer
    # behind an extra - `memoria.index` (the core, imported by the CLI
    # itself) owns the table's shape, and ADR-0007's own consequences name
    # this "the core's first non-trivial runtime dependency" rather than
    # something to keep optional. Both are pinned exactly, as the ADR asks:
    # `sqlite-vec` is pre-1.0, and a `fastembed` bump could silently change
    # what a rebuilt index's vectors mean.
    #
    # Installing this pulls in `onnxruntime` and the rest of `fastembed`'s
    # chain, but downloads no model weights by itself - that only happens
    # the first time something actually calls `memoria.embeddings.
    # default_embed_fn` (fetched from the Hugging Face Hub), which nothing
    # in this package's own test suite does (see `memoria.embeddings`).
    "fastembed==0.8.0",
    "sqlite-vec==0.1.9",
]

[project.scripts]
memoria = "memoria.cli:main"
# For a human starting the server by hand. `.mcp.json` uses `python -m
# memoria.mcp` instead, which needs no reinstall to exist.
memoria-mcp = "memoria.mcp.server:main"

[project.optional-dependencies]
# The MCP server (issue #11) is an adapter over the core, not part of it. The
# SDK pulls in a web-server stack - pydantic, starlette, uvicorn, httpx2,
# pyjwt, opentelemetry - and the core's own runtime dependencies are PyYAML,
# `sqlite-vec` and `fastembed` (the semantic index, #81, ADR-0007) and
# nothing else, so it rides in an extra rather than in `dependencies`. `dev`
# depends on the extra, which means the documented install (`pip install -e
# ".[dev]"`, used by the README and by orca.yaml) always yields an importable
# server and no test needs `importorskip` - a skipped test in this repo is a
# failed one.
# The FastAPI adapter (#64) takes the same shape when it lands.
#
# Major pinned: mcp 2.0 was a breaking rename (FastMCP -> MCPServer,
# mcp.server.fastmcp -> mcp.server.mcpserver).
mcp = [
    "mcp>=2.1,<3",
]
# The FastAPI adapter (#64), the third over the core. Same reasoning as
# `mcp` above: the core's own runtime dependencies stay PyYAML plus the
# semantic index's `sqlite-vec` and `fastembed` (#81, ADR-0007) and nothing
# else, and `dev` pulling this extra in is what keeps a route importable in
# every test rather than skipped.
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
]
# The docx/pdf normalizer (#77, part 05 §5.4): MarkItDown for docx, pdfplumber
# for pdf, read directly by memoria.normalize's converter seam. Same
# reasoning as mcp/web above - the core's own runtime dependencies stay
# PyYAML plus the semantic index's `sqlite-vec` and `fastembed` (#81,
# ADR-0007) and nothing else, and `dev` pulling this extra in is what keeps
# `memoria normalize` exercising a real converter in every test rather than
# a skip. `docx` is MarkItDown's own extra for its mammoth-based docx path.
#
# Pinned exactly, not a range (#79, part 05 §5.4): the paragraph hash is the
# extraction's memo key, so a converter version a bare range could silently
# pick up would reconvert every unit it touches with no record of when or
# why. A bump is a deliberate edit here, `memoria validate` checks it against
# what `raw/manifest.yaml` recorded at the last normalize run, and
# `memoria normalize --all` afterwards reports how many paragraph hashes it
# changed before the extraction ever reads them.
convert = [
    "markitdown[docx]==0.1.7",
    "pdfplumber==0.11.10",
    # `.msg` (#104): read directly with olefile rather than MarkItDown's own
    # outlook extra - `.msg`'s `PR_TRANSPORT_MESSAGE_HEADERS`/`PR_BODY`
    # properties are reassembled into an RFC822 message and reused by the
    # same email converter `.eml`/`.mbox` already share (memoria.normalize's
    # `_read_msg_message`), so its pin is `EMAIL_CONVERTER_VERSION`, not a
    # package version string - pinned exactly here anyway for the same
    # reproducibility as the other two.
    "olefile==0.47",
]
# The extraction's clustering (#17). Unlike `mcp` and `web` this is not an
# adapter - it is core index-maintainer logic - but it takes the same shape
# for the same reason: the core's own runtime dependencies stay PyYAML plus
# the semantic index's `sqlite-vec` and `fastembed` (#81, ADR-0007) and
# nothing else, and `dev` pulls the extra so the clustering tests never skip.
#
# `graspologic-native` (ADR-0005 build shape 1's preferred Leiden backend) is
# deliberately NOT here. If `dev` pulled it, the suite would only ever
# exercise Leiden and never the networkx fallback that most installs actually
# run - and the fallback is the path with the hand-written hierarchy in it.
# `memoria.clustering` uses it when it is importable; install it by hand to
# get Leiden.
graph = [
    "networkx>=3,<4",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "memoria[mcp]",
    "memoria[web]",
    "memoria[convert]",
    # Test-only: builds the .docx fixtures the converter tests convert.
    # Never imported by memoria itself.
    "python-docx>=1.1,<2",
    "memoria[graph]",
]

[tool.setuptools.packages.find]
where = ["src"]
