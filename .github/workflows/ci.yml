# The two test suites scripts/test.sh runs locally, as PR checks.
# Both are hermetic: no secrets, no env vars, no evidence corpus
# (orca.yaml: a test that needs MEMORIA_EVIDENCE_ROOT is a bug).
# Playwright gate walks (ui/gate/) are deliberately not here - CLAUDE.md
# says they run by name for a milestone, not routinely.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
